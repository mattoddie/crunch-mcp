# Publishing a GitHub release (tag vX.Y.Z) builds the Docker image for
# amd64 and arm64 and pushes it to ghcr.io/<owner>/crunch-mcp, then builds the
# MCP Bundles for Claude Desktop and uploads them to the release. Stable
# releases are then published to the official MCP Registry.
# See docs/releasing.md.
name: Release

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: write # append image details to the release notes
      packages: write # push to ghcr.io
      id-token: write # sign the build provenance attestation
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      stable: ${{ steps.version.outputs.stable }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Validate tag
        id: version
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must be semantic versions like v1.2.3 or v1.2.3-rc.1 (got '$TAG')."
            exit 1
          fi
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Stable releases get the moving tags (X.Y, X, latest); pre-releases only their exact version.
          if [[ "$version" == *-* || "${{ github.event.release.prerelease }}" == "true" ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }},enable=${{ steps.version.outputs.stable }}
            type=semver,pattern={{major}},value=${{ env.TAG }},enable=${{ steps.version.outputs.stable == 'true' && !startsWith(env.TAG, 'v0.') }}
            type=raw,value=latest,enable=${{ steps.version.outputs.stable }}
          labels: |
            org.opencontainers.image.title=crunch-mcp
            org.opencontainers.image.description=MCP server for Crunch Accounting
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.title=crunch-mcp
            org.opencontainers.image.description=MCP server for Crunch Accounting
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          # No build cache: release images are built from scratch so nothing cached
          # by another workflow run can end up in a published image.
          no-cache: true
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Add image details to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          gh release view "$TAG" --json body --jq .body > notes.md
          {
            echo
            echo "## Container image"
            echo
            echo '```sh'
            echo "docker pull $IMAGE:$VERSION"
            echo '```'
            echo
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\` · Digest: \`$DIGEST\`"
            echo
            echo "Tags: $(echo "$TAGS" | sed 's/.*:/`/; s/$/`/' | paste -sd ' ' | sed 's/ /, /g')"
          } >> notes.md
          gh release edit "$TAG" --notes-file notes.md

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published \`$IMAGE:$VERSION\`"
            echo
            echo "$TAGS" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

  mcpb:
    name: Build and upload MCP Bundles
    # After the image: that job validates the tag, and the tests run inside its build.
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets and append to the release notes
      id-token: write # sign the build provenance attestation
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No build cache, for the same reason as the image.
          cache: false

      - name: Build
        run: make mcpb VERSION="${TAG#v}"

      - name: Validate the manifests
        run: |
          for f in dist/*.mcpb; do
            dir=".build/unpacked/$(basename "$f" .mcpb)"
            mkdir -p "$dir"
            unzip -q "$f" -d "$dir"
            npx -y @anthropic-ai/mcpb@2.1.2 validate "$dir/manifest.json"
            test "$(jq -r .version "$dir/manifest.json")" = "${TAG#v}"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.mcpb

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          gh release upload "$TAG" dist/*.mcpb --clobber
          gh release view "$TAG" --json body --jq .body > notes.md
          # Re-running the workflow must not add the section twice.
          if grep -q '^## Claude Desktop' notes.md; then
            exit 0
          fi
          {
            echo
            echo "## Claude Desktop"
            echo
            echo "Download the bundle for your computer and open it to install crunch-mcp as a Claude Desktop extension. See [Claude Desktop](https://crunch-mcp.mattoddie.dev/docs/clients/#claude-desktop) for the settings."
            echo
            echo "| Computer | Bundle |"
            echo "|---|---|"
            echo "| Mac with Apple silicon | \`crunch-mcp-$version-darwin-arm64.mcpb\` |"
            echo "| Mac with an Intel processor | \`crunch-mcp-$version-darwin-amd64.mcpb\` |"
            echo "| Windows on x64 | \`crunch-mcp-$version-windows-amd64.mcpb\` |"
            echo "| Windows on Arm | \`crunch-mcp-$version-windows-arm64.mcpb\` |"
            echo "| Linux | \`crunch-mcp-$version-linux-amd64.mcpb\`, \`crunch-mcp-$version-linux-arm64.mcpb\` |"
          } >> notes.md
          gh release edit "$TAG" --notes-file notes.md

  registry:
    name: Publish to the MCP Registry
    # After both: the registry checks the image's label and that the bundles can be downloaded.
    needs: [image, mcpb]
    # Stable releases only. The registry treats every version as final and marks the
    # newest as latest, so release candidates stay off it.
    if: needs.image.outputs.stable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # download the bundles from the release
      id-token: write # log in to the registry with GitHub OIDC
    env:
      TAG: ${{ github.event.release.tag_name }}
      VERSION: ${{ needs.image.outputs.version }}
      SERVER: io.github.mattoddie/crunch-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check whether this version is already published
        id: published
        run: |
          # A version can only be published once, so a re-run after a successful publish skips it.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0/servers/${SERVER//\//%2F}/versions/$VERSION")
          case "$code" in
            200) echo "already=true" >> "$GITHUB_OUTPUT"; echo "::notice::$SERVER $VERSION is already in the MCP Registry." ;;
            404) echo "already=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::The MCP Registry returned HTTP $code."; exit 1 ;;
          esac

      - name: Stamp server.json
        if: steps.published.outputs.already == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Hash the bundles as published, which is what clients download and check.
          gh release download "$TAG" --pattern '*.mcpb' --dir dist
          make server-json VERSION="$VERSION"
          cat dist/server.json

      - name: Install mcp-publisher
        if: steps.published.outputs.already == 'false'
        run: make mcp-publisher

      - name: Publish
        if: steps.published.outputs.already == 'false'
        run: |
          .build/mcp-publisher/mcp-publisher validate dist/server.json
          .build/mcp-publisher/mcp-publisher login github-oidc
          .build/mcp-publisher/mcp-publisher publish dist/server.json

      - name: Summary
        if: steps.published.outputs.already == 'false'
        run: |
          echo "### Published \`$SERVER\` $VERSION to the [MCP Registry](https://registry.modelcontextprotocol.io/v0/servers?search=$SERVER)" >> "$GITHUB_STEP_SUMMARY"
