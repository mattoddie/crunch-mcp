<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="crunch-mcp logo">
  <defs>
    <linearGradient id="cm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#84CC16"/>
      <stop offset="0.5" stop-color="#10B981"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <radialGradient id="cm-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#cm-bg)"/>
  <circle cx="54" cy="58" r="46" fill="url(#cm-glow)"/>
  <!-- A ledger page: rows, an amounts column and a double-ruled total. -->
  <rect x="20" y="22" width="64" height="84" rx="9" fill="#FFFFFF"/>
  <g stroke="#0F766E" stroke-width="3.5" stroke-linecap="round">
    <line x1="30" y1="38" x2="52" y2="38" stroke-opacity="0.45"/>
    <line x1="30" y1="50" x2="46" y2="50" stroke-opacity="0.45"/>
    <line x1="30" y1="62" x2="50" y2="62" stroke-opacity="0.45"/>
    <line x1="30" y1="74" x2="42" y2="74" stroke-opacity="0.45"/>
    <line x1="63" y1="38" x2="74" y2="38"/>
    <line x1="67" y1="50" x2="74" y2="50"/>
    <line x1="63" y1="62" x2="74" y2="62"/>
    <line x1="66" y1="74" x2="74" y2="74"/>
  </g>
  <line x1="57" y1="30" x2="57" y2="80" stroke="#10B981" stroke-opacity="0.35" stroke-width="2"/>
  <g stroke="#10B981" stroke-width="3" stroke-linecap="round">
    <line x1="58" y1="88" x2="76" y2="88"/>
    <line x1="58" y1="95" x2="76" y2="95"/>
  </g>
  <!-- The connector: the page plugs in. -->
  <rect x="84" y="52" width="18" height="28" rx="5" fill="#FFFFFF"/>
  <rect x="80" y="58" width="6" height="16" fill="#FFFFFF"/>
  <g fill="#FFFFFF">
    <rect x="100" y="56" width="15" height="6" rx="3"/>
    <rect x="100" y="70" width="15" height="6" rx="3"/>
  </g>
  <circle cx="93" cy="66" r="3" fill="#10B981"/>
</svg>
